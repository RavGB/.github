name: Report a problem
description: One of our tools gave a wrong result, crashed, or did not run.
title: "[Problem] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to tell us. Everything on this page is public, so please do not paste passwords, keys, tokens or private details. Replace them with `xxxx`.
  - type: input
    id: tool
    attributes:
      label: Which tool?
      placeholder: site-check
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      placeholder: site-check https://example.com
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: The output
      description: Paste the output, or the part that looks wrong.
      render: text
  - type: dropdown
    id: os
    attributes:
      label: Your computer
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: How you installed it, and your Go version if you know it
      placeholder: go install, Go 1.25
